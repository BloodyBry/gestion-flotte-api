services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Variable manquante}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Variable manquante}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data: